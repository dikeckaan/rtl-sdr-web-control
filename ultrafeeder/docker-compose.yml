services:
  ultrafeeder:
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:latest
    container_name: ultrafeeder
    restart: unless-stopped
    device_cgroup_rules:
      - "c 189:* rwm"
    ports:
      - "8090:80"
    environment:
      TZ: Europe/Istanbul
      READSB_DEVICE_TYPE: rtlsdr
      READSB_LAT: "40.94247"
      READSB_LON: "29.14824"
      READSB_ALT: "82m"
      MLAT_USER: "dikeckaan"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ultrafeeder_globe_history:/var/globe_history
      - ultrafeeder_collectd:/var/lib/collectd
      - /proc/diskstats:/proc/diskstats:ro
    tmpfs:
      - /run:exec,size=64M
      - /tmp

  piaware:
    image: ghcr.io/sdr-enthusiasts/docker-piaware:latest
    container_name: piaware
    restart: unless-stopped
    depends_on:
      - ultrafeeder
    environment:
      TZ: Europe/Istanbul
      FEEDER_ID: "790d0a84-345b-4370-866d-501a467b9d93"
      RECEIVER_TYPE: relay
      BEASTHOST: ultrafeeder
      BEASTPORT: "30005"
      ALLOW_MLAT: "yes"
      MLAT_RESULTS: "yes"
      MLAT_RESULTS_BEASTHOST: ultrafeeder
      MLAT_RESULTS_BEASTPORT: "30104"
    tmpfs:
      - /run:exec,size=64M
      - /var/log

  fr24feed:
    image: ghcr.io/sdr-enthusiasts/docker-flightradar24:latest
    container_name: fr24feed
    restart: unless-stopped
    depends_on:
      - ultrafeeder
    ports:
      - "8754:8754"
    environment:
      BEASTHOST: ultrafeeder
      BEASTPORT: "30005"
      FR24KEY: "61109b8bce847030"
      MLAT: "yes"
    dns_search:
      - .

volumes:
  ultrafeeder_globe_history:
  ultrafeeder_collectd:
