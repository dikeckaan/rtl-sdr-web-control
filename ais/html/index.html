<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIS Gemi Takip</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; }
        .header {
            background: #16213e;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #4ecca3;
            z-index: 1000;
            position: relative;
        }
        .header h1 { color: #4ecca3; font-size: 1.3em; }
        .stats { display: flex; gap: 15px; }
        .stat { text-align: center; }
        .stat .label { font-size: 0.7em; color: #888; text-transform: uppercase; }
        .stat .value { font-size: 1.1em; color: #4ecca3; font-weight: bold; font-family: monospace; }
        .conn-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .conn-dot.ok { background: #4ecca3; box-shadow: 0 0 4px #4ecca3; }
        .conn-dot.err { background: #e94560; }
        #map { height: calc(100vh - 52px); width: 100%; }
        .ship-popup { font-family: 'Segoe UI', sans-serif; }
        .ship-popup h3 { color: #16213e; margin-bottom: 4px; }
        .ship-popup .detail { font-size: 0.85em; color: #555; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AIS Gemi Takip</h1>
        <div class="stats">
            <div class="stat">
                <div class="label">Gemiler</div>
                <div class="value" id="shipCount">0</div>
            </div>
            <div class="stat">
                <div class="label">Mesajlar</div>
                <div class="value" id="msgCount">0</div>
            </div>
            <div class="stat">
                <div class="label">Durum</div>
                <div class="value"><span class="conn-dot err" id="connDot"></span><span id="connText">Baglaniyor</span></div>
            </div>
        </div>
    </div>
    <div id="map"></div>

    <script>
        // Istanbul center
        const map = L.map('map').setView([40.94, 29.15], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 18
        }).addTo(map);

        const shipMarkers = {};
        let shipCount = 0;
        let msgCount = 0;

        const shipIcon = L.divIcon({
            className: 'ship-icon',
            html: '<svg width="20" height="20" viewBox="0 0 20 20"><polygon points="10,2 16,18 10,14 4,18" fill="#4ecca3" stroke="#16213e" stroke-width="1"/></svg>',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        function createRotatedIcon(heading) {
            return L.divIcon({
                className: 'ship-icon',
                html: `<svg width="20" height="20" viewBox="0 0 20 20" style="transform: rotate(${heading || 0}deg)"><polygon points="10,2 16,18 10,14 4,18" fill="#4ecca3" stroke="#16213e" stroke-width="1"/></svg>`,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
        }

        function updateShip(ship) {
            if (!ship.lat || !ship.lon) return;
            msgCount++;
            document.getElementById('msgCount').textContent = msgCount;

            const mmsi = ship.mmsi;
            const heading = ship.heading || ship.course || 0;

            if (shipMarkers[mmsi]) {
                shipMarkers[mmsi].setLatLng([ship.lat, ship.lon]);
                shipMarkers[mmsi].setIcon(createRotatedIcon(heading));
            } else {
                const marker = L.marker([ship.lat, ship.lon], { icon: createRotatedIcon(heading) }).addTo(map);
                shipMarkers[mmsi] = marker;
                shipCount++;
                document.getElementById('shipCount').textContent = shipCount;
            }

            const name = ship.name || 'Bilinmeyen';
            const speed = ship.speed !== undefined ? ship.speed + ' kn' : '-';
            const course = ship.course !== undefined ? ship.course + '°' : '-';
            const dest = ship.destination || '-';

            shipMarkers[mmsi].bindPopup(
                `<div class="ship-popup">` +
                `<h3>${name}</h3>` +
                `<div class="detail"><b>MMSI:</b> ${mmsi}</div>` +
                `<div class="detail"><b>Hiz:</b> ${speed}</div>` +
                `<div class="detail"><b>Rota:</b> ${course}</div>` +
                `<div class="detail"><b>Hedef:</b> ${dest}</div>` +
                `<div class="detail"><b>Konum:</b> ${ship.lat.toFixed(4)}, ${ship.lon.toFixed(4)}</div>` +
                `</div>`
            );
        }

        // Socket.IO
        const socket = io({ transports: ['websocket', 'polling'] });
        socket.on('connect', () => {
            document.getElementById('connDot').className = 'conn-dot ok';
            document.getElementById('connText').textContent = 'Bagli';
        });
        socket.on('disconnect', () => {
            document.getElementById('connDot').className = 'conn-dot err';
            document.getElementById('connText').textContent = 'Kesildi';
        });
        socket.on('ship_update', updateShip);

        // Initial load
        fetch('/api/ships').then(r => r.json()).then(data => {
            data.ships.forEach(updateShip);
            document.getElementById('msgCount').textContent = data.stats.messages;
        });
    </script>
</body>
</html>
