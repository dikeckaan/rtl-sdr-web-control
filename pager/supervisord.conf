[supervisord]
nodaemon=true
logfile=/var/log/pager/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[program:pager_decoder]
command=/opt/pager/start_pager.sh
directory=/opt/pager
autostart=true
autorestart=true
startsecs=5
startretries=999
stdout_logfile=/var/log/pager/decoder_stdout.log
stderr_logfile=/var/log/pager/decoder_stderr.log

[program:flask_app]
command=python3 /opt/pager/app.py
directory=/opt/pager
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/pager/flask_stdout.log
stderr_logfile=/var/log/pager/flask_stderr.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/pager/nginx_stdout.log
stderr_logfile=/var/log/pager/nginx_stderr.log
