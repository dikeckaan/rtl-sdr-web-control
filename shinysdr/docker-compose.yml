services:
  shinysdr:
    image: jeffersonjhunt/shinysdr:linux-arm64v8-v1.4.0
    container_name: shinysdr
    restart: unless-stopped
    privileged: true
    ports:
      - "8090:8100"
      - "8101:8101"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./config:/config
    command: start /config/my-config
    tmpfs:
      - /tmp
