services:
  shinysdr:
    image: jeffersonjhunt/shinysdr:linux-arm64v8-v1.4.0
    container_name: shinysdr
    restart: unless-stopped
    privileged: true
    expose:
      - "8100"
      - "8101"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /home/kaandikec/sdr/shinysdr/config:/config
    command: start /config/my-config
    tmpfs:
      - /tmp

  shinysdr-proxy:
    image: nginx:alpine
    container_name: shinysdr-proxy
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - /home/kaandikec/sdr/shinysdr/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - shinysdr
