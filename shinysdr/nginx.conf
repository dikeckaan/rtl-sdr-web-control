user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 256;
}

http {
    sendfile on;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8090;

        # Rewrite WS URLs:
        # 1. Port 8101 -> same origin (no port for tunnel, 8090 for local)
        # 2. ws:// -> wss:// when accessed via HTTPS (Cloudflare)
        sub_filter ':8101/' ':8090/';
        sub_filter ':8101"' ':8090"';
        sub_filter_once off;
        sub_filter_types text/html application/json application/javascript text/javascript;

        # Inject a script that patches WebSocket to fix ws:// -> wss:// on HTTPS
        location = /public/ {
            proxy_pass http://shinysdr:8100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            sub_filter '</head>' '<script>
(function(){
  var OrigWS = window.WebSocket;
  window.WebSocket = function(url, protocols) {
    // Fix scheme: ws -> wss on https pages
    if (location.protocol === "https:" && url.indexOf("ws://") === 0) {
      url = "wss://" + url.substring(5);
    }
    // Fix port: remove :8090 when on standard https (443)
    if (location.protocol === "https:") {
      url = url.replace(/:8090\//, "/");
    }
    return protocols ? new OrigWS(url, protocols) : new OrigWS(url);
  };
  window.WebSocket.prototype = OrigWS.prototype;
  window.WebSocket.CONNECTING = OrigWS.CONNECTING;
  window.WebSocket.OPEN = OrigWS.OPEN;
  window.WebSocket.CLOSING = OrigWS.CLOSING;
  window.WebSocket.CLOSED = OrigWS.CLOSED;
})();
</script></head>';
            sub_filter_once on;
        }

        # WebSocket paths
        location ~* ^/(public/)?(radio|audio-stream) {
            proxy_pass http://shinysdr:8101;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Everything else -> HTTP
        location / {
            proxy_pass http://shinysdr:8100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
