user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 256;
}

http {
    sendfile on;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8090;

        # Rewrite port 8101 references to 8090 in HTML/JS responses
        sub_filter ':8101/' ':8090/';
        sub_filter ':8101"' ':8090"';
        sub_filter_once off;
        sub_filter_types text/html application/json application/javascript text/javascript;

        # WebSocket paths (ShinySDR uses /radio and /audio-stream)
        location ~* ^/(public/)?radio {
            proxy_pass http://shinysdr:8101;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location ~* ^/(public/)?audio-stream {
            proxy_pass http://shinysdr:8101;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Everything else goes to HTTP
        location / {
            proxy_pass http://shinysdr:8100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
