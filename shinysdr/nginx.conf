user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 256;
}

http {
    sendfile on;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8090;

        # Fix redirects: strip port from Location headers so CF tunnel works
        proxy_redirect ~^(https?://[^:/]+):\d+(/.*)$ $1$2;

        # Rewrite WS URLs:
        # 1. Port 8101 -> same origin (no port for tunnel, 8090 for local)
        # 2. ws:// -> wss:// when accessed via HTTPS (Cloudflare)
        sub_filter ':8101/' ':8090/';
        sub_filter ':8101"' ':8090"';
        sub_filter_once off;
        sub_filter_types text/html application/json application/javascript text/javascript;

        # Main page: rewrite WS URLs and inject WS interceptor
        location = /public/ {
            proxy_pass http://shinysdr:8100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Accept-Encoding "";

            # Rewrite hardcoded :8101 to :8090 (host varies based on request)
            sub_filter ':8101/' ':8090/';
            sub_filter ':8101"' ':8090"';
            sub_filter '</head>' '<script>
(function(){
  var OrigWS = window.WebSocket;
  function PatchedWS(url, protocols) {
    if (location.protocol === "https:") {
      // ws -> wss
      if (url.indexOf("ws://") === 0) url = "wss://" + url.substring(5);
      // Remove :8090 port (CF uses 443)
      url = url.replace(/:8090\//, "/");
    }
    console.log("[ShinySDR-proxy] WS:", url);
    return protocols ? new OrigWS(url, protocols) : new OrigWS(url);
  }
  PatchedWS.prototype = OrigWS.prototype;
  PatchedWS.CONNECTING = OrigWS.CONNECTING;
  PatchedWS.OPEN = OrigWS.OPEN;
  PatchedWS.CLOSING = OrigWS.CLOSING;
  PatchedWS.CLOSED = OrigWS.CLOSED;
  window.WebSocket = PatchedWS;
})();
</script></head>';
            sub_filter_once off;
            sub_filter_types text/html;
        }

        # WebSocket paths
        location ~* ^/(public/)?(radio|audio-stream) {
            proxy_pass http://shinysdr:8101;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            proxy_cache off;
        }

        # Everything else -> HTTP
        location / {
            proxy_pass http://shinysdr:8100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Accept-Encoding "";
        }
    }
}
