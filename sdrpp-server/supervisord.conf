[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx24
autorestart=true
priority=10

[program:sdrpp]
command=/usr/bin/sdrpp
environment=DISPLAY=":99"
autorestart=true
priority=20
startsecs=3

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -nopw -shared -rfbport 5900
autorestart=true
priority=30
startsecs=2

[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 8090 localhost:5900
autorestart=true
priority=40
startsecs=2
