[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:icecast]
command=/usr/bin/icecast2 -c /etc/icecast2/icecast.xml
autostart=true
autorestart=true
stdout_logfile=/var/log/icecast_stdout.log
stderr_logfile=/var/log/icecast_stderr.log
priority=10

[program:hamradio]
command=/usr/local/bin/start_ham.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/hamradio_stdout.log
stderr_logfile=/var/log/hamradio_stderr.log
priority=20

[program:flask]
command=python3 /opt/app.py
autostart=true
autorestart=true
stdout_logfile=/var/log/flask_stdout.log
stderr_logfile=/var/log/flask_stderr.log
priority=15

[program:nginx]
command=/usr/sbin/nginx
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx_stdout.log
stderr_logfile=/var/log/nginx_stderr.log
priority=30
