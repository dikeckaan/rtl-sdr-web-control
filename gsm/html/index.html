<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSM Baz Istasyonu Tarama</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .header {
            background: #16213e;
            padding: 15px 20px;
            border-bottom: 2px solid #4ecca3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { color: #4ecca3; font-size: 1.4em; }
        .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em;
            transition: all 0.2s;
        }
        .btn-scan { background: #4ecca3; color: #1a1a2e; }
        .btn-scan:hover { background: #3db890; }
        .btn-scan:disabled { background: #555; cursor: not-allowed; }
        .btn-band { background: transparent; border: 1px solid #4ecca3; color: #4ecca3; padding: 6px 14px; }
        .btn-band:hover { background: rgba(78,204,163,0.15); }
        .btn-band.active { background: #4ecca3; color: #1a1a2e; }

        .status-bar {
            background: #16213e;
            padding: 10px 20px;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 0.85em;
            flex-wrap: wrap;
        }
        .stat { color: #888; }
        .stat b { color: #4ecca3; }
        .scanning-indicator { display: none; color: #e94560; animation: blink 1s infinite; }
        .scanning-indicator.active { display: inline; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .content { padding: 20px; }

        /* Spectrum chart */
        .spectrum-container {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #0f3460;
            display: none;
        }
        .spectrum-container h3 { color: #4ecca3; margin-bottom: 10px; font-size: 0.95em; }
        .spectrum-chart {
            width: 100%;
            height: 150px;
            position: relative;
            overflow-x: auto;
        }
        .spectrum-bar {
            display: inline-block;
            vertical-align: bottom;
            width: 6px;
            margin: 0 1px;
            border-radius: 2px 2px 0 0;
            background: #4ecca3;
            min-height: 2px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .spectrum-bar:hover { background: #e94560; }
        .spectrum-bar.weak { background: #555; }
        .spectrum-bar.medium { background: #f0a500; }
        .spectrum-bar.strong { background: #4ecca3; }
        .spectrum-bar.very-strong { background: #e94560; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }
        thead th {
            text-align: left;
            padding: 10px 12px;
            color: #4ecca3;
            border-bottom: 2px solid #4ecca3;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        thead th:hover { color: #fff; }
        tbody td {
            padding: 8px 12px;
            border-bottom: 1px solid #2a2a4a;
        }
        tbody tr:hover { background: rgba(78,204,163,0.05); }
        .operator-cell { font-weight: 600; }
        .turkcell { color: #ffd700; }
        .vodafone { color: #e60000; }
        .turk-telekom { color: #00a0e3; }
        .power-bar {
            display: inline-block;
            height: 8px;
            border-radius: 4px;
            background: #4ecca3;
            min-width: 4px;
            margin-right: 6px;
            vertical-align: middle;
        }
        .no-data { text-align: center; padding: 40px; color: #888; }
        .no-data p { margin-top: 8px; font-size: 0.9em; }

        @media (max-width: 700px) {
            .header { padding: 10px 15px; }
            .content { padding: 10px; }
            table { font-size: 0.75em; }
            thead th, tbody td { padding: 6px 8px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GSM Baz Istasyonu Tarama</h1>
        <div class="controls">
            <button class="btn btn-band active" data-band="ALL" onclick="selectBand('ALL')">Tumu</button>
            <button class="btn btn-band" data-band="GSM900" onclick="selectBand('GSM900')">GSM 900</button>
            <button class="btn btn-band" data-band="DCS1800" onclick="selectBand('DCS1800')">DCS 1800</button>
            <button class="btn btn-scan" id="scanBtn" onclick="startScan()">Tarama Baslat</button>
        </div>
    </div>
    <div class="status-bar">
        <span class="stat">Bulunan: <b id="cellCount">0</b> kanal</span>
        <span class="stat">Son tarama: <b id="lastScan">-</b></span>
        <span class="scanning-indicator" id="scanIndicator">Tarama yapiliyor...</span>
    </div>
    <div class="content">
        <div class="spectrum-container" id="spectrumContainer">
            <h3>Spektrum Gorunumu (GSM900: 935-960 MHz)</h3>
            <div class="spectrum-chart" id="spectrumChart"></div>
        </div>

        <div id="noData" class="no-data">
            <h2 style="color: #4ecca3">Tarama Baslatilmadi</h2>
            <p>"Tarama Baslat" butonuna basarak cevredeki GSM sinyallerini tarayin.</p>
            <p style="color: #555; font-size: 0.8em; margin-top: 15px;">Not: Tarama yaklasik 30-60 saniye surer.</p>
        </div>
        <table id="resultsTable" style="display: none;">
            <thead>
                <tr>
                    <th onclick="sortBy('freq')">Frekans (MHz)</th>
                    <th onclick="sortBy('arfcn')">ARFCN</th>
                    <th onclick="sortBy('band')">Bant</th>
                    <th onclick="sortBy('operator')">Operator</th>
                    <th onclick="sortBy('power')">Sinyal (dB)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        let results = [];
        let selectedBand = 'ALL';
        let sortField = 'power';
        let sortAsc = false;

        function selectBand(band) {
            selectedBand = band;
            document.querySelectorAll('.btn-band').forEach(b => {
                b.classList.toggle('active', b.dataset.band === band);
            });
        }

        function getOperatorClass(op) {
            if (!op) return '';
            if (op.includes('Turkcell')) return 'turkcell';
            if (op.includes('Vodafone')) return 'vodafone';
            if (op.includes('Turk Telekom')) return 'turk-telekom';
            return '';
        }

        function getPowerClass(power) {
            if (power > 5) return 'very-strong';
            if (power > -5) return 'strong';
            if (power > -10) return 'medium';
            return 'weak';
        }

        function sortBy(field) {
            if (sortField === field) sortAsc = !sortAsc;
            else { sortField = field; sortAsc = false; }
            renderTable();
        }

        function renderSpectrum() {
            const container = document.getElementById('spectrumContainer');
            const chart = document.getElementById('spectrumChart');

            if (results.length === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            chart.innerHTML = '';

            // Find min/max power for scaling
            const powers = results.map(r => r.power);
            const minP = Math.min(...powers);
            const maxP = Math.max(...powers);
            const range = Math.max(maxP - minP, 10);

            results.forEach(r => {
                const bar = document.createElement('div');
                const height = Math.max(4, ((r.power - minP) / range) * 140);
                bar.className = 'spectrum-bar ' + getPowerClass(r.power);
                bar.style.height = height + 'px';
                bar.title = `${r.freq} MHz (ARFCN ${r.arfcn})\n${r.power} dB\n${r.operator || ''}`;
                chart.appendChild(bar);
            });
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const sorted = [...results].sort((a, b) => {
                const va = a[sortField] ?? -9999;
                const vb = b[sortField] ?? -9999;
                if (typeof va === 'string') return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
                return sortAsc ? va - vb : vb - va;
            });

            sorted.forEach(r => {
                const tr = document.createElement('tr');
                const powerWidth = r.power != null ? Math.max(4, Math.min(100, (r.power + 30) * 3)) : 4;
                const opClass = getOperatorClass(r.operator);
                tr.innerHTML =
                    `<td>${r.freq || '-'}</td>` +
                    `<td>${r.arfcn != null ? r.arfcn : '-'}</td>` +
                    `<td>${r.band || '-'}</td>` +
                    `<td class="operator-cell ${opClass}">${r.operator || '-'}</td>` +
                    `<td><span class="power-bar" style="width:${powerWidth}px"></span>${r.power != null ? r.power.toFixed(1) : '-'}</td>`;
                tbody.appendChild(tr);
            });
        }

        async function startScan() {
            const btn = document.getElementById('scanBtn');
            btn.disabled = true;
            btn.textContent = 'Taraniyor...';
            document.getElementById('scanIndicator').classList.add('active');

            try {
                await fetch('/api/scan', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({band: selectedBand})
                });
                pollResults();
            } catch (e) {
                btn.disabled = false;
                btn.textContent = 'Tarama Baslat';
            }
        }

        async function pollResults() {
            const check = async () => {
                try {
                    const resp = await fetch('/api/results');
                    const data = await resp.json();

                    if (!data.scanning) {
                        const btn = document.getElementById('scanBtn');
                        btn.disabled = false;
                        btn.textContent = 'Tarama Baslat';
                        document.getElementById('scanIndicator').classList.remove('active');

                        results = data.results || [];
                        document.getElementById('cellCount').textContent = results.length;
                        document.getElementById('lastScan').textContent = data.timestamp || '-';

                        if (results.length > 0) {
                            document.getElementById('noData').style.display = 'none';
                            document.getElementById('resultsTable').style.display = 'table';
                            renderSpectrum();
                            renderTable();
                        } else {
                            document.getElementById('noData').innerHTML =
                                '<h2 style="color: #e94560">Sinyal Bulunamadi</h2>' +
                                '<p>Esik degerinin altinda sinyal yok. Anteni kontrol edin veya tekrar deneyin.</p>';
                            document.getElementById('noData').style.display = 'block';
                        }
                        return;
                    }
                    setTimeout(check, 3000);
                } catch (e) {
                    setTimeout(check, 3000);
                }
            };
            setTimeout(check, 3000);
        }

        // Check for existing results on load
        fetch('/api/results').then(r => r.json()).then(data => {
            if (data.results && data.results.length > 0) {
                results = data.results;
                document.getElementById('cellCount').textContent = results.length;
                document.getElementById('lastScan').textContent = data.timestamp || '-';
                document.getElementById('noData').style.display = 'none';
                document.getElementById('resultsTable').style.display = 'table';
                renderSpectrum();
                renderTable();
            }
            if (data.scanning) pollResults();
        });
    </script>
</body>
</html>
