<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FM Radyo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { margin: 20px 0 10px; font-size: 1.8em; color: #e94560; }
        .player-card { background: #16213e; border-radius: 12px; padding: 30px; width: 100%; max-width: 500px; text-align: center; border: 2px solid #0f3460; margin-bottom: 20px; }
        .freq-display { font-size: 2.5em; color: #4ecca3; font-weight: bold; margin: 15px 0; font-family: monospace; }
        .status { color: #888; font-size: 0.85em; margin-bottom: 15px; }
        .status.playing { color: #4ecca3; }
        .status.switching { color: #f0a500; }
        #bigPlay { display: none; width: 80px; height: 80px; border-radius: 50%; background: #4ecca3; color: #1a1a2e; border: none; font-size: 2em; cursor: pointer; margin: 15px auto; }
        #bigPlay:hover { background: #3db890; }
        #bigPlay.show { display: block; }
        .presets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 15px; }
        .preset-btn { padding: 8px 16px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; border-radius: 8px; cursor: pointer; font-size: 0.85em; transition: all 0.2s; }
        .preset-btn:hover { border-color: #4ecca3; color: #4ecca3; }
        .preset-btn.active { background: #4ecca3; color: #1a1a2e; border-color: #4ecca3; font-weight: 600; }
        .manual { margin-top: 20px; display: flex; gap: 10px; justify-content: center; align-items: center; }
        .manual input { padding: 10px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; border-radius: 8px; width: 120px; font-size: 1em; text-align: center; }
        .manual input:focus { outline: none; border-color: #4ecca3; }
        .manual button { padding: 10px 20px; background: #4ecca3; color: #1a1a2e; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95em; }
    </style>
</head>
<body>
    <h1>FM Radyo</h1>

    <div class="player-card">
        <div class="freq-display" id="freqDisplay">-- MHz</div>
        <div class="status" id="status">Yukleniyor...</div>
        <button id="bigPlay" onclick="startPlaying()">&#9654;</button>
        <div class="presets" id="presets"></div>
        <div class="manual">
            <input type="text" id="freqInput" placeholder="Orn: 96.2">
            <button onclick="tuneManual()">Ayarla</button>
        </div>
    </div>

    <script>
        let currentFreq = '';
        let presets = [];
        let audio = null;
        let playing = false;

        function createAudio() {
            if (audio) { audio.pause(); audio.src = ''; }
            audio = new Audio('/stream?t=' + Date.now());
            audio.addEventListener('playing', () => {
                document.getElementById('status').textContent = 'Canli yayin';
                document.getElementById('status').className = 'status playing';
                document.getElementById('bigPlay').classList.remove('show');
            });
            audio.addEventListener('error', () => {
                if (playing) {
                    // Stream broke, retry in 1s
                    setTimeout(() => { if (playing) createAudio(); }, 1000);
                }
            });
        }

        function startPlaying() {
            playing = true;
            createAudio();
            audio.play().catch(() => {});
            document.getElementById('bigPlay').classList.remove('show');
            document.getElementById('status').textContent = 'Baglaniliyor...';
        }

        async function loadState() {
            const res = await fetch('/api/freq');
            const data = await res.json();
            currentFreq = data.freq;
            presets = data.presets;
            updateDisplay();
            renderPresets();
            document.getElementById('status').textContent = 'Dinlemek icin basin';
            document.getElementById('bigPlay').classList.add('show');
        }

        function updateDisplay() {
            document.getElementById('freqDisplay').textContent = currentFreq.replace('M', '') + ' MHz';
        }

        function renderPresets() {
            const c = document.getElementById('presets');
            c.innerHTML = '';
            presets.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'preset-btn' + (p.freq === currentFreq ? ' active' : '');
                btn.textContent = p.name + ' (' + p.freq.replace('M', '') + ')';
                btn.onclick = () => tune(p.freq);
                c.appendChild(btn);
            });
        }

        async function tune(freq) {
            document.getElementById('status').textContent = 'Kanal degistiriliyor...';
            document.getElementById('status').className = 'status switching';

            const res = await fetch('/api/freq', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({freq: freq})
            });
            const data = await res.json();
            currentFreq = data.freq;
            updateDisplay();
            renderPresets();

            if (playing) {
                // Stream never broke (loop-based restart), just reconnect audio
                setTimeout(() => createAudio(), 500);
                audio.play().catch(() => {});
            }
        }

        function tuneManual() {
            const v = document.getElementById('freqInput').value.trim();
            if (v) tune(v.endsWith('M') ? v : v + 'M');
        }

        document.getElementById('freqInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') tuneManual();
        });

        loadState();
    </script>
</body>
</html>
