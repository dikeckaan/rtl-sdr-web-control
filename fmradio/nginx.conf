worker_processes 1;
daemon off;
pid /tmp/nginx.pid;
events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    server {
        listen 8090;

        location / {
            root /var/www/html;
            index index.html;
        }

        location /stream {
            proxy_pass http://127.0.0.1:8000/fmradio;
            proxy_set_header Host $host;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:5000/api/;
            proxy_set_header Host $host;
        }
    }
}
